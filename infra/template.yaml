AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  LedgerLens: S3 upload -> Lambda -> Textract -> validation -> DynamoDB.
  Fully serverless: nothing runs while idle, you pay per processed document.

Parameters:
  CompanyTaxId:
    Type: String
    Default: ""
    Description: Tax ID of the company receiving the documents (optional)
  ConfidenceThreshold:
    Type: Number
    Default: 90
    MinValue: 0
    MaxValue: 100

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 60
    CodeUri: ../src/

Resources:
  DocumentsBucket:
    Type: AWS::S3::Bucket

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }

  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ledgerlens.handlers.process.handler
      Description: Reads each uploaded document, validates it and stores the result
      Environment:
        Variables:
          TABLE_NAME: !Ref DocumentsTable
          COMPANY_TAX_ID: !Ref CompanyTaxId
          CONFIDENCE_THRESHOLD: !Ref ConfidenceThreshold
      Policies:
        - AmazonS3FullAccess
        - AmazonDynamoDBFullAccess
        - AmazonTextractFullAccess
      Events:
        FileUploaded:
          Type: S3
          Properties:
            Bucket: !Ref DocumentsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: inbox/ }

Outputs:
  Bucket:
    Value: !Ref DocumentsBucket
  Table:
    Value: !Ref DocumentsTable
